<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tìm phương án tối ưu</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1>Giải Bài Toán Tối Ưu Tuyến Tính</h1>

            <div class="section-title">Thiết lập bài toán</div>

            <div class="input-row">
                <label>Số biến (ẩn số):</label>
                <input
                    type="number"
                    id="numVars"
                    class="input-field"
                    value="2"
                    min="1"
                    max="26"
                />
            </div>

            <div class="input-row">
                <label>Hệ số của các biến:</label>
                <div id="variableInputs" class="variable-inputs"></div>
            </div>

            <div class="input-row">
                <label>Hàm mục tiêu:</label>
                <input
                    type="text"
                    id="resultFormula"
                    class="result-field"
                    readonly
                />
            </div>

            <div class="input-row">
                <label>Loại bài toán:</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input
                            type="radio"
                            id="max"
                            name="optType"
                            value="max"
                            checked
                        />
                        <label for="max">Tối đa hóa</label>
                    </div>
                    <div class="radio-option">
                        <input
                            type="radio"
                            id="min"
                            name="optType"
                            value="min"
                        />
                        <label for="min">Tối thiểu hóa</label>
                    </div>
                </div>
            </div>

            <hr />

            <div class="constraint-header">
                <h3 class="section-title">Các ràng buộc</h3>
                <div class="buttons">
                    <button id="btnAdd">Thêm ràng buộc</button>
                    <button id="btnDelete">Xóa ràng buộc</button>
                    <button id="btnClear">Xóa tất cả</button>
                </div>
            </div>

            <div id="constraintsContainer">
                <div class="constraint-row">
                    <input
                        type="text"
                        class="constraint-input"
                        placeholder="Ví dụ: 1A + 2B hoặc A, B"
                    />
                    <select class="constraint-operator">
                        <option value=">=">≥</option>
                        <option value="<=">≤</option>
                        <option value="=">=</option>
                        <option value=">">></option>
                        <option value="<"><</option>
                    </select>
                    <input
                        type="text"
                        class="constraint-input"
                        placeholder="Ví dụ: 10"
                    />
                </div>
            </div>

            <div
                class="buttons"
                style="margin-top: 20px; justify-content: center"
            >
                <button id="btnSolve">Giải bài toán</button>
            </div>

            <div class="result-area" id="resultArea">
                Kết quả sẽ hiển thị ở đây sau khi giải bài toán.
            </div>
        </div>

        <script src="/index.js"></script>
    </body>
</html>
